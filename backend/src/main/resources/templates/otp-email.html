<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Your verification code</title>
    <style>
        @media (prefers-color-scheme: dark) {
            .card { background-color: #1f2129 !important; }
            .body-bg { background-color: #121317 !important; }
            .heading { color: #f4f4f7 !important; }
            .body-text { color: #b8bac2 !important; }
            .muted-text { color: #7d7f89 !important; }
            .otp-box { background-color: #2a2c36 !important; color: #f4f4f7 !important; }
            .divider { border-color: #34363f !important; }
        }
        @media screen and (max-width: 520px) {
            .container { width: 100% !important; }
            .padded { padding: 24px !important; }
        }
    </style>
</head>
<body class="body-bg" style="margin:0; padding:0; background-color:#f4f4f7; font-family:'Helvetica Neue', Helvetica, Arial, sans-serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" class="body-bg" style="background-color:#f4f4f7; padding:40px 0;">
        <tr>
            <td align="center">
                <table role="presentation" width="480" cellpadding="0" cellspacing="0" class="container" style="width:480px; max-width:480px;">
                    <tr>
                        <td style="padding:0 0 24px; text-align:center;">
                            <span style="display:inline-block; font-size:20px; font-weight:700; letter-spacing:0.5px; color:#4f46e5;">SimplyC</span>
                        </td>
                    </tr>
                    <tr>
                        <td class="card" style="background-color:#ffffff; border-radius:12px; box-shadow:0 2px 10px rgba(20,20,43,0.06); overflow:hidden;">
                            <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
                                <tr>
                                    <td style="height:6px; background:linear-gradient(90deg,#4f46e5,#7c6cf6); font-size:0; line-height:0;">&nbsp;</td>
                                </tr>
                                <tr>
                                    <td class="padded" style="padding:40px 40px 32px; text-align:center;">
                                        <h1 class="heading" style="margin:0 0 12px; font-size:20px; font-weight:600; color:#1a1a1a;">Verify it's you</h1>
                                        <p class="body-text" style="margin:0 0 28px; font-size:15px; line-height:1.5; color:#5a5c66;">
                                            Enter this code to finish signing in to your account.
                                        </p>
                                        <div class="otp-box" style="display:inline-block; min-width:220px; padding:18px 28px; background-color:#f5f4ff; border:1px solid #e3e1fb; border-radius:8px; font-size:32px; font-weight:700; letter-spacing:10px; color:#4f46e5;" th:text="${code}">
                                            000000
                                        </div>
                                        <p class="muted-text" style="margin:28px 0 0; font-size:13px; line-height:1.5; color:#9497a1;" th:text="'This code expires in ' + ${ttlMinutes} + ' minutes.'">
                                            This code expires in 5 minutes.
                                        </p>
                                        <hr class="divider" style="border:none; border-top:1px solid #edecf3; margin:28px 0;"/>
                                        <p class="muted-text" style="margin:0; font-size:13px; line-height:1.5; color:#9497a1;">
                                            If you didn't request this, you can safely ignore this email.
                                        </p>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>
                    <tr>
                        <td style="padding:24px 8px 0; text-align:center;">
                            <p class="muted-text" style="margin:0; font-size:12px; color:#a6a8b3;">
<!--                                &copy; SimplyC. All rights reserved.-->
                            </p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>
</html>
